<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="900" viewBox="0 0 820 900"
     xmlns="http://www.w3.org/2000/svg">

  <!-- ============================================================
       GameDino Platform — Use Case Diagram
       Last updated: 2026-04-10

       Actors
         Guest              — unauthenticated; can only register or log in
         Authenticated Player — logged-in user; full platform access

       Zones
         Pre-Authentication  — top section (no login required)
         Game Platform       — dashed sub-boundary (requires login)
  ============================================================ -->

  <!-- Background -->
  <rect width="820" height="900" fill="#f2f2f2"/>

  <!-- ── Outer system boundary ─────────────────────────────────── -->
  <rect x="15" y="15" width="790" height="870" rx="10"
        fill="white" stroke="#2c2e33" stroke-width="2"/>
  <text x="30" y="46" font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#1c1c1e">GameDino Platform</text>

  <!-- ── Pre-Authentication zone label ─────────────────────────── -->
  <text x="160" y="74" font-family="Arial, sans-serif" font-size="11"
        font-style="italic" fill="#777">Pre-Authentication</text>

  <!-- ── Separator between pre-auth and game platform ─────────── -->
  <line x1="20" y1="278" x2="800" y2="278"
        stroke="#999" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- ── Game Platform sub-boundary (dashed) ───────────────────── -->
  <rect x="25" y="288" width="775" height="582" rx="8"
        fill="none" stroke="#5a4fcf" stroke-width="1.5" stroke-dasharray="10,5"/>
  <text x="42" y="312" font-family="Arial, sans-serif" font-size="13"
        font-style="italic" font-weight="bold" fill="#5a4fcf">Game Platform</text>
  <text x="42" y="328" font-family="Arial, sans-serif" font-size="10"
        fill="#888">«requires authentication»</text>

  <!-- ============================================================
       GUEST ACTOR  — head centre (78, 135)
  ============================================================ -->
  <circle cx="78" cy="135" r="14" fill="white" stroke="#2c2e33" stroke-width="2"/>
  <!-- body -->
  <line x1="78" y1="149" x2="78" y2="196" stroke="#2c2e33" stroke-width="2"/>
  <!-- arms -->
  <line x1="52"  y1="169" x2="104" y2="169" stroke="#2c2e33" stroke-width="2"/>
  <!-- legs -->
  <line x1="78" y1="196" x2="57"  y2="222" stroke="#2c2e33" stroke-width="2"/>
  <line x1="78" y1="196" x2="99"  y2="222" stroke="#2c2e33" stroke-width="2"/>
  <text x="78" y="240" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#2c2e33">Guest</text>

  <!-- ── Pre-Auth use cases ──────────────────────────────────────
       UC-02  Create Account   cx=430, cy=120
       UC-03  Log in           cx=430, cy=215
  ─────────────────────────────────────────────────────────────── -->
  <ellipse cx="430" cy="120" rx="108" ry="30"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="430" y="125" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Create Account</text>

  <ellipse cx="430" cy="215" rx="108" ry="30"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="430" y="220" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Log in</text>

  <!-- Guest → Create Account -->
  <line x1="104" y1="153" x2="322" y2="121"
        stroke="#333" stroke-width="1.5"/>
  <!-- Guest → Log in -->
  <line x1="104" y1="169" x2="322" y2="215"
        stroke="#333" stroke-width="1.5"/>

  <!-- ============================================================
       AUTHENTICATED PLAYER ACTOR — head centre (78, 565)
  ============================================================ -->
  <circle cx="78" cy="565" r="14" fill="white" stroke="#2c2e33" stroke-width="2"/>
  <!-- body -->
  <line x1="78" y1="579" x2="78" y2="626" stroke="#2c2e33" stroke-width="2"/>
  <!-- arms -->
  <line x1="52"  y1="600" x2="104" y2="600" stroke="#2c2e33" stroke-width="2"/>
  <!-- legs -->
  <line x1="78" y1="626" x2="57"  y2="652" stroke="#2c2e33" stroke-width="2"/>
  <line x1="78" y1="626" x2="99"  y2="652" stroke="#2c2e33" stroke-width="2"/>
  <text x="78" y="672" font-family="Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="#2c2e33">Authenticated</text>
  <text x="78" y="687" font-family="Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="#2c2e33">Player</text>

  <!-- ── Authenticated use cases ────────────────────────────────
       LEFT COLUMN  cx=375  (ellipse left edge ≈ 267)
         UC-04  View Dashboard        y=370
         UC-05  Join Game Lobby       y=452
         UC-06  Enqueue for Match     y=534
         UC-09  Submit Move           y=616
         UC-07  Chat in Game          y=698
         UC-11  Log Out               y=780

       RIGHT COLUMN  cx=645  (ellipse left edge ≈ 545)
         UC-13  View Profile          y=370
         UC-14  Change Settings       y=452
         UC-15  Play vs DinoBot       y=534
         UC-16  View Leaderboard      y=616
  ─────────────────────────────────────────────────────────────── -->

  <!-- Left column -->
  <ellipse cx="375" cy="370" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="375" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">View Dashboard</text>

  <ellipse cx="375" cy="452" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="457" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Join Game Lobby</text>

  <ellipse cx="375" cy="534" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="539" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Enqueue for Match</text>

  <ellipse cx="375" cy="616" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="621" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Submit Move</text>

  <ellipse cx="375" cy="698" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="703" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Chat in Game</text>

  <ellipse cx="375" cy="780" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="375" y="785" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Log Out</text>

  <!-- Right column -->
  <ellipse cx="645" cy="370" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="645" y="375" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">View Profile</text>

  <ellipse cx="645" cy="452" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="645" y="457" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Change Settings</text>

  <ellipse cx="645" cy="534" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="645" y="539" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">Play vs DinoBot</text>

  <ellipse cx="645" cy="616" rx="108" ry="28"
           fill="#c5bdff" stroke="#5a4fcf" stroke-width="1.5"/>
  <text x="645" y="621" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#1c1c1e">View Leaderboard</text>

  <!-- ── Lines: Authenticated Player → Left column ─────────────── -->
  <line x1="104" y1="580" x2="267" y2="371" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="588" x2="267" y2="452" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="597" x2="267" y2="534" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="602" x2="267" y2="616" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="610" x2="267" y2="698" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="618" x2="267" y2="780" stroke="#333" stroke-width="1.5"/>

  <!-- ── Lines: Authenticated Player → Right column ────────────── -->
  <line x1="104" y1="576" x2="537" y2="372" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="583" x2="537" y2="454" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="592" x2="537" y2="536" stroke="#333" stroke-width="1.5"/>
  <line x1="104" y1="600" x2="537" y2="618" stroke="#333" stroke-width="1.5"/>

  <!-- ── «extend» note: Log in unlocks Game Platform ───────────── -->
  <line x1="430" y1="245" x2="430" y2="278"
        stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="435" y="268" font-family="Arial, sans-serif" font-size="10"
        fill="#666">«unlocks Game Platform»</text>

</svg>
